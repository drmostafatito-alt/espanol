# إعداد الإنتاج — Español بالعربي
#
# ملف مستقل عن wrangler.toml (ملف التطوير الملتزَم)، ولا يُقرأ تلقائيًا:
#   نشر:  npx wrangler deploy --config wrangler.production.toml
#   فحص:  node tools/check-deploy-ready.mjs --file wrangler.production.toml
#
# لا أسرار في هذا الملف أبدًا. الأسرار تُضبط بأمر واحد لكل سر (انظر §الأسرار أدناه).
# كل قيمة هنا موجودة فعليًا في إعداد المشروع؛ لا معرّفات ولا نطاقات مُختلَقة.

name = "learn"
main = "src/worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# يجعل Worker يرى كل طلب (لا الأصول فقط) حتى تُضاف الرؤوس الأمنية إلى مستند HTML نفسه.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "es-ar-prod"
# معرّف قاعدة الإنتاج كما هو في حساب المالك. لا يُعاد توليده ولا يُخترع.
database_id = "010988b9-2e64-4bfd-bb41-5ceacd0dba86"

[vars]
ENVIRONMENT = "production"
# النطاق الفعلي على workers.dev (مجاني، بلا دومين مخصص). الكوكي يصبح __Host-ses
# وSecure تلقائيًا لأن الأصل https، والتحقق من Origin يقبل هذا الأصل وحده.
APP_ORIGIN = "https://learn.espanol-balarabi.workers.dev"

# معرّف عميل Google OAuth — **عام** ليس سرًا (السر هو GOOGLE_CLIENT_SECRET).
# بدونه يُغلق مسار Google فشلًا مغلقًا برسالة عامة، ولا يُنشأ أي مستخدم جديد.
GOOGLE_CLIENT_ID = "446561850098-ejol9v5jqjkg2fqes4vsr5cgian7prl7.apps.googleusercontent.com"

# ✅ التسجيل العام بالبريد وكلمة المرور **مفتوح ومجاني** (قرار المالك 2026-10-30).
# كيف يبقى آمنًا على خطة Workers المجانية (حد 10ms CPU/طلب):
#   - المتصفح يُشتق المفتاح بـ600,000 تكرار PBKDF2-SHA256 (متطلب OWASP) على ملح
#     حتمي يشتقه الخادم بـHMAC(pepper, email). هذا مجاني تمامًا ولا يستهلك CPU في Worker.
#   - الخادم يطبّق طبقة ثانية (PBKDF2 30,000 + pepper) على المفتاح المشتق.
#   - من يسرق قاعدة البيانات يحتاج ≥630,000 تكرار لكل تخمين، ولا يستطيع بدء الاشتقاق
#     بلا pepper (مفتاح HMAC للملح) — أي فوق متطلب OWASP.
#   - كلمة المرور نفسها لا تصل إلى الخادم في هذا المسار إطلاقًا.
# إبقاء أي من المتغيّرين التاليين غير مضبوط مع ALLOW_PUBLIC_SIGNUP="true" ⇒ البوابة تفشل.
ALLOW_PUBLIC_SIGNUP = "true"
CLIENT_KDF_REQUIRED = "true"
CLIENT_KDF_ITERATIONS = "600000"

# قياس workerd الفعلي (reports/kdf-benchmark.md): 30k ≈ 5ms، 600k ≈ 94ms،
# وميزانية الخطة المجانية 10ms CPU/طلب. 30k هي أقصى ما يدخل الميزانية بهامش 2×.
PBKDF2_ITERATIONS = "30000"

SESSION_TTL_DAYS = "30"

# --- الأسرار (لا تُكتب هنا ولا في أي ملف ولا في Git ولا في المحادثة) -------------
#   npx wrangler secret put PASSWORD_PEPPER --config wrangler.production.toml
#       إلزامي، ≥32 حرفًا عشوائيًا. بدونه يفشل كل مسار مصادقة بـ503 (فشل مغلق).
#   npx wrangler secret put GOOGLE_CLIENT_SECRET --config wrangler.production.toml
#       إلزامي لتفعيل الدخول عبر Google. تبادل الكود على الخادم فقط.
