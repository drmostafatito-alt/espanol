# عيّنة اختبار فقط — ليست إعداد نشر حقيقي.
# تُستخدم في tests/deploy-preflight.test.ts لإثبات أن بوابة ما قبل النشر تمرّ على إعداد إنتاجي سليم،
# فلا تكون بوابة ترفض كل شيء. المعرّفات وهمية وليست لأي قاعدة موجودة.

name = "espanol-balarabi"
main = "src/worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "es-ar-prod"
database_id = "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://espanol.example.com"
MEDIA_ORIGIN = "https://media.espanol.example.com/media"
PBKDF2_ITERATIONS = "600000"
ALLOW_PUBLIC_SIGNUP = "false"
SESSION_TTL_DAYS = "30"
