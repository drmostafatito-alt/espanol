# عيّنة اختبار فقط — إعداد على شكل wrangler الإنتاجي المعتاد:
# قسم [vars] للتطوير + قسم [env.production.vars] للنشر.
# تُثبت أن البوابة تقرأ قسم الإنتاج، لا قسم [vars] التطويري (عيب حقيقي كان موجودًا).
# المعرّفات وهمية وليست لأي قاعدة موجودة.

name = "espanol-balarabi"
main = "src/worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "es-ar-dev"
database_id = "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"

[vars]
ENVIRONMENT = "development"
APP_ORIGIN = "http://localhost:5173,http://localhost:8787"
MEDIA_ORIGIN = "http://localhost:8787/media"
PBKDF2_ITERATIONS = "30000"
ALLOW_PUBLIC_SIGNUP = "true"
SESSION_TTL_DAYS = "30"

[env.production.vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://espanol.example.com"
MEDIA_ORIGIN = "https://media.espanol.example.com/media"
PBKDF2_ITERATIONS = "600000"
ALLOW_PUBLIC_SIGNUP = "false"
SESSION_TTL_DAYS = "30"
